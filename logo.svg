<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Morfologia Espermática Kruger" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#0f4c6b"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe3dc"/>
      <stop offset="1" stop-color="#12a5a5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- anel de "campo de microscópio" -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#12a5a5" stroke-opacity=".35" stroke-width="10"/>
  <circle cx="256" cy="256" r="172" fill="#0b2545" fill-opacity=".55"/>
  <!-- cauda -->
  <path d="M232 266 C190 300 190 340 224 356 C262 374 292 346 306 380 C316 404 340 408 360 396"
        fill="none" stroke="#12a5a5" stroke-width="16" stroke-linecap="round"/>
  <!-- cabeça (elipse inclinada) -->
  <g transform="rotate(-38 276 218)">
    <ellipse cx="276" cy="218" rx="74" ry="50" fill="url(#head)"/>
    <ellipse cx="256" cy="204" rx="30" ry="16" fill="#fff" fill-opacity=".35"/>
  </g>
  <!-- marcas de contagem (tally) -->
  <g stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-opacity=".9">
    <line x1="120" y1="388" x2="120" y2="424"/>
    <line x1="146" y1="388" x2="146" y2="424"/>
    <line x1="172" y1="388" x2="172" y2="424"/>
    <line x1="106" y1="420" x2="186" y2="392"/>
  </g>
</svg>
